name: h00k Desktop Windows
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true
on:
  workflow_dispatch:
  pull_request:
    paths:
      - 'desktop/**'
      - '.github/workflows/h00k-desktop-windows.yml'
jobs:
  windows-build:
    runs-on: windows-latest
    permissions:
      contents: read
    defaults:
      run:
        working-directory: desktop
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
      - name: Install desktop dependencies
        run: npm install --no-audit --no-fund
      - name: Validate desktop layout and state
        run: npm test
      - name: Compile and execute read-only Win32 window agent
        run: powershell.exe -NoProfile -NonInteractive -ExecutionPolicy Bypass -File win-agent.ps1 -Once
      - name: Build Windows installer
        run: npm run dist
      - name: Verify installer EXE embeds original h00k robot icon
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer not found' }
          & ./scripts/verify-installer-icon.ps1 -Installer $installer.FullName -RobotIcon ./build/h00k-installer.ico
      - name: Smoke-test NSIS installer and shortcut on real Windows
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Windows installer not found' }
          & ./scripts/smoke-installer.ps1 -Installer $installer.FullName
      - name: Prepare animated compact setup and embed checked NSIS payload
        run: node installer/prepare.cjs
      - name: Install compact setup dependencies
        run: npm install --prefix installer --no-audit --no-fund
      - name: Test compact setup security, progress and locales
        run: npm test --prefix installer
      - name: Build animated h00k Setup
        env:
          DEBUG: electron-builder
        run: npm run dist --prefix installer
      - name: Verify branded icon in animated setup EXE
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer/dist -Filter '*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Animated h00k Setup not found' }
          & ./scripts/verify-installer-icon.ps1 -Installer $setup.FullName -RobotIcon ./build/h00k-installer.ico
      - name: Verify portable setup actually contains the NSIS payload
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer/dist -Filter '*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Animated h00k Setup not found' }
          $proc = Start-Process -FilePath $setup.FullName -ArgumentList '--self-test' -Wait -PassThru
          if ($proc.ExitCode -ne 0) { throw "Animated setup integrity test failed: $($proc.ExitCode)" }
      - name: Publish SHA-256 for animated setup
        shell: pwsh
        run: |
          $setup = Get-ChildItem installer/dist -Filter '*.exe' | Select-Object -First 1
          if (-not $setup) { throw 'Animated h00k Setup not found' }
          $hash = (Get-FileHash -LiteralPath $setup.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($setup.Name)" | Set-Content -LiteralPath installer/dist/SHA256SUMS.txt -Encoding ascii
      - uses: actions/upload-artifact@v4
        with:
          name: h00k-animated-windows-setup
          path: |
            desktop/installer/dist/*.exe
            desktop/installer/dist/SHA256SUMS.txt
          if-no-files-found: error
      - name: Generate SHA-256 checksum
        shell: pwsh
        run: |
          $installer = Get-ChildItem dist -Filter '*.exe' | Select-Object -First 1
          if (-not $installer) { throw 'Installer not found' }
          $hash = (Get-FileHash -LiteralPath $installer.FullName -Algorithm SHA256).Hash.ToLowerInvariant()
          "$hash  $($installer.Name)" | Set-Content -LiteralPath 'dist/SHA256SUMS.txt' -Encoding ascii
          Write-Host "SHA256 $($installer.Name): $hash"
      - uses: actions/upload-artifact@v4
        with:
          name: h00k-desktop-windows
          path: |
            desktop/dist/*.exe
            desktop/dist/SHA256SUMS.txt
            desktop/build/h00k-robot-preview.png
            desktop/build/h00k-installer.ico
          if-no-files-found: error
