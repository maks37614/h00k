name: CoinGecko Demo Holders Checks

on:
  push:
    branches: [main]
    paths:
      - 'server/coingeckoHolders.ts'
      - 'server.ts'
      - 'src/components/SmartAnalysisBlock.tsx'
      - 'src/types.ts'
      - 'tests/coingecko-holders.test.ts'
      - '.github/workflows/coingecko-holders.yml'
  pull_request:
    branches: [main]
    paths:
      - 'server/coingeckoHolders.ts'
      - 'server.ts'
      - 'src/components/SmartAnalysisBlock.tsx'
      - 'src/types.ts'
      - 'tests/coingecko-holders.test.ts'
      - '.github/workflows/coingecko-holders.yml'

jobs:
  holder-tests:
    runs-on: ubuntu-latest
    timeout-minutes: 6
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: CoinGecko offline and quota regression tests
        run: node --import tsx --test tests/coingecko-holders.test.ts
