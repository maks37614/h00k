name: Verify h00k

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - name: Install dependencies
        run: npm ci
      - name: Type check
        run: npm run lint
      - name: Encyclopedia regression tests
        run: node --import tsx --test tests/encyclopediaKotapych.test.ts tests/encyclopediaClassicRules.test.ts
      - name: Surveillance header and dropdown regression tests
        run: node --import tsx --test tests/surveillance-header-layout.test.ts tests/surveillance-dropdown-style.test.ts
      - name: HookChart visual profile and real-preview regression tests
        run: node --import tsx --test tests/hookchart-visual-profiles.test.ts tests/hookchart-real-visual-preview.test.ts
      - name: Build
        run: npm run build
      - name: Tests
        run: npm test
