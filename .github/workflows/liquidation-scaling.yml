name: Liquidation Scaling Safety

on:
  push:
    branches: [main]
    paths:
      - 'server/liquidationFeed.ts'
      - 'server/liquidationUpstreamPool.ts'
      - 'src/components/hookchart/liquidationStream.ts'
      - 'src/components/hookchart/liquidationMultiplexClient.ts'
      - 'tests/liquidation-multi-client-relay.test.ts'
      - 'tests/liquidation-browser-multiplex.test.ts'
      - 'tests/liquidation-feed.test.ts'
      - 'tests/liquidation-upstream-pool.test.ts'
      - 'tests/hookchart-shared-liquidation-view.test.ts'
      - 'tests/hookchart-liquidation-socket-lifecycle.test.ts'
      - '.github/workflows/liquidation-scaling.yml'
  pull_request:
    branches: [main]

jobs:
  liquidation:
    runs-on: ubuntu-latest
    timeout-minutes: 8
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm
      - run: npm ci
      - name: TypeScript validation
        run: npm run lint
      - name: Liquidation protocol, pooling and existing HookChart regression
        run: node --import ./tests/fixtures/offline-network.mjs --import tsx --test tests/liquidation-feed.test.ts tests/liquidation-upstream-pool.test.ts tests/liquidation-multi-client-relay.test.ts tests/liquidation-browser-multiplex.test.ts tests/hookchart-shared-liquidation-view.test.ts tests/hookchart-liquidation-socket-lifecycle.test.ts
